name: Daily KRX Pattern Scanner

on:
  schedule:
    - cron: '0 12 * * 1-5' # 평일 KST 21:00
  workflow_dispatch:

jobs:
  analyze_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul # 서버 시간을 한국 시간(KST)으로 고정
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 패키지 설치
        run: pip install --upgrade pip && pip install finance-datareader pykrx pandas lxml beautifulsoup4 requests matplotlib google-genai

      - name: 장마감 데이터 수집 및 Gemini 분석 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyze_stocks.py

      - name: 분석 결과(daily_picks.json) 자동 커밋 및 배포
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_picks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily picks" && git push)
